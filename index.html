<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagen a Pantalla Completa con Música</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-image: url('foto.jpg');
            background-size: cover; 
            background-position: center center; 
            background-repeat: no-repeat; 
            background-color: #000; 
        }
    </style>
</head>
<body>
    
    <!-- Audio oculto de fondo -->
    <!-- 'autoplay' hace que inicie al abrir la web, 'loop' hace que se repita sin fin -->
    <audio src="musica.mp3" autoplay loop></audio>

</body>
</html>
