<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fondo Espacial Realista</title>
    <style>
        /* Reseteo para que ocupe toda la pantalla sin bordes ni scroll */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <canvas id="space"></canvas>

    <script>
        const canvas = document.getElementById('space');
        const ctx = canvas.getContext('2d');

        let width, height;
        let stars = [];
        let spaceObjects = [];
        let assetsLoaded = false;
        
        // ⚙️ CONFIGURACIÓN DEL EFECTO:
        const config = {
            numStars: 800,        // Cantidad de estrellas (puntos de luz)
            baseSpeed: 8,         // Velocidad base del viaje
            maxPlanets: 1,        // Máximo de planetas en pantalla a la vez
            maxAsteroids: 3,      // Máximo de asteroides en pantalla a la vez
            planetProb: 0.001,    // Probabilidad de que aparezca un planeta
            asteroidProb: 0.005,  // Probabilidad de que aparezca un asteroide
            planetBaseSize: 300,  // Tamaño base máximo de un planeta
            asteroidBaseSize: 50  // Tamaño base máximo de un asteroide
        };

        // URLs de imágenes PNG reales con fondo transparente (Wikimedia Commons)
        const planetImagesUrls = [
            'https://upload.wikimedia.org/wikipedia/commons/2/22/Earth_Western_Hemisphere_transparent_background.png', // Tierra
            'https://upload.wikimedia.org/wikipedia/commons/e/e2/Jupiter.png', // Júpiter
            'https://upload.wikimedia.org/wikipedia/commons/0/02/OSIRIS_Mars_true_color.png' // Marte
        ];
        
        const asteroidImagesUrls = [
            'https://upload.wikimedia.org/wikipedia/commons/a/a2/Asteroid_Bennu_mosaic.png', // Asteroide Bennu
            'https://upload.wikimedia.org/wikipedia/commons/d/d4/Vesta_in_natural_color.png' // Asteroide Vesta
        ];

        let planetImages = [];
        let asteroidImages = [];

        // Función para cargar las imágenes antes de iniciar la animación
        async function loadAssets() {
            const loadPlanetImages = planetImagesUrls.map(url => {
                return new Promise(resolve => {
                    const img = new Image();
                    img.crossOrigin = "Anonymous"; // Evita problemas de CORS
                    img.src = url;
                    img.onload = () => resolve(img);
                });
            });
            const loadAsteroidImages = asteroidImagesUrls.map(url => {
                return new Promise(resolve => {
                    const img = new Image();
                    img.crossOrigin = "Anonymous";
                    img.src = url;
                    img.onload = () => resolve(img);
                });
            });

            planetImages = await Promise.all(loadPlanetImages);
            asteroidImages = await Promise.all(loadAsteroidImages);
            assetsLoaded = true;
        }

        // Ajusta el canvas al tamaño de la pantalla
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        // Clase que maneja el efecto de las estrellas (líneas blancas)
        class Star {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = (Math.random() - 0.5) * width * 2;
                this.y = (Math.random() - 0.5) * height * 2;
                this.z = Math.random() * width; 
                this.pz = this.z; 
            }

            update() {
                this.z -= config.baseSpeed;
                if (this.z <= 0) {
                    this.reset();
                    this.z = width;
                    this.pz = this.z;
                }
            }

            draw() {
                let sx = (this.x / this.z) * (width / 2) + width / 2;
                let sy = (this.y / this.z) * (height / 2) + height / 2;

                let px = (this.x / this.pz) * (width / 2) + width / 2;
                let py = (this.y / this.pz) * (height / 2) + height / 2;
                this.pz = this.z;

                let r = (1 - this.z / width) * 3;
                let alpha = 1 - this.z / width;

                ctx.beginPath();
                ctx.moveTo(px, py);
                ctx.lineTo(sx, sy);
                ctx.lineWidth = r;
                ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.stroke();
            }
        }

        // Clase que maneja las imágenes de planetas y asteroides
        class SpaceObject {
            constructor(type, imagesArray) {
                this.type = type;
                this.imagesArray = imagesArray;
                this.isActive = false;
            }

            activate() {
                // Posición inicial aleatoria (más lejos y amplia)
                this.x = (Math.random() - 0.5) * width * 3; 
                this.y = (Math.random() - 0.5) * height * 3; 
                this.z = width + Math.random() * width; 
                this.pz = this.z;
                
                // Asigna imagen y tamaño según el tipo
                this.image = this.imagesArray[Math.floor(Math.random() * this.imagesArray.length)];
                this.baseSize = (this.type === 'planet') ? config.planetBaseSize : config.asteroidBaseSize;
                
                // Rotación inicial y velocidad de giro
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.005; 
                this.isActive = true;
            }

            update() {
                if (!this.isActive) return;
                this.z -= config.baseSpeed;
                this.rotation += this.rotationSpeed;
                
                // Si nos sobrepasa, se desactiva
                if (this.z <= 0) {
                    this.isActive = false; 
                }
            }

            draw() {
                if (!this.isActive || !this.image || !assetsLoaded) return;

                let sx = (this.x / this.z) * (width / 2) + width / 2;
                let sy = (this.y / this.z) * (height / 2) + height / 2;
                let size = (1 - this.z / width) * this.baseSize; 

                if (size > 0) {
                    ctx.save();
                    ctx.translate(sx, sy);
                    ctx.rotate(this.rotation);
                    ctx.globalAlpha = Math.max(0, 1 - (this.z / width)); 
                    ctx.drawImage(this.image, -size / 2, -size / 2, size, size);
                    ctx.restore();
                }
            }
        }

        // Crear las estrellas iniciales
        for (let i = 0; i < config.numStars; i++) {
            stars.push(new Star());
        }

        // Controla cuándo aparecen nuevos planetas o asteroides
        function attemptToSpawnObjects() {
            const activePlanets = spaceObjects.filter(obj => obj.type === 'planet' && obj.isActive).length;
            const activeAsteroids = spaceObjects.filter(obj => obj.type === 'asteroid' && obj.isActive).length;

            if (activePlanets < config.maxPlanets && Math.random() < config.planetProb) {
                const newPlanet = new SpaceObject('planet', planetImages);
                newPlanet.activate();
                spaceObjects.push(newPlanet);
            }
            if (activeAsteroids < config.maxAsteroids && Math.random() < config.asteroidProb) {
                const newAsteroid = new SpaceObject('asteroid', asteroidImages);
                newAsteroid.activate();
                spaceObjects.push(newAsteroid);
            }
        }

        // Bucle principal de animación
        function animate() {
            if (!assetsLoaded) {
                requestAnimationFrame(animate);
                return;
            }

            // Fondo negro con opacidad para crear el rastro de las estrellas
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.fillRect(0, 0, width, height);

            // Dibujar estrellas
            stars.forEach(star => {
                star.update();
                star.draw();
            });

            // Intentar generar nuevos planetas/rocas
            attemptToSpawnObjects();

            // Dibujar planetas y rocas, filtrando los inactivos
            spaceObjects = spaceObjects.filter(obj => obj.isActive);
            spaceObjects.forEach(obj => {
                obj.update();
                obj.draw();
            });

            requestAnimationFrame(animate);
        }

        // Iniciar la carga de imágenes y, al terminar, arrancar la animación
        loadAssets().then(() => animate());
    </script>
</body>
</html>
