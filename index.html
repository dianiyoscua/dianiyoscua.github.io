<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predicción Bonoloto - Acceso Restringido</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace; 
            color: rgba(255, 255, 255, 0.85);
        }
        
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* --- PANTALLA DE SEGURIDAD --- */
        #security-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }

        .security-box {
            text-align: center;
            padding: 30px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(0, 255, 204, 0.3);
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.15);
            width: 85%;
            max-width: 350px;
        }

        .security-box h2 {
            margin-top: 0;
            margin-bottom: 25px;
            color: #fff;
            font-size: 1.1rem;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        .security-box input {
            padding: 12px;
            font-size: 1.2rem;
            border-radius: 5px;
            border: 1px solid #00ffcc;
            background: rgba(0, 0, 0, 0.5);
            color: #00ffcc;
            outline: none;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            width: 100%;
            box-sizing: border-box;
            text-transform: lowercase;
        }

        .security-box button {
            display: block;
            margin: 20px auto 0;
            padding: 10px 25px;
            font-size: 1rem;
            cursor: pointer;
            background: #00ffcc;
            color: #000;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            text-transform: uppercase;
            transition: all 0.3s;
        }

        .error-shake { animation: shake 0.4s; }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
            100% { transform: translateX(0); }
        }

        /* --- PANELES DE INFORMACIÓN (Reloj, Clima) --- */
        .info-panel {
            position: absolute;
            z-index: 3;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            backdrop-filter: blur(3px);
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }

        #top-left-panel { top: 20px; left: 20px; }
        #top-right-panel { top: 20px; right: 20px; text-align: right; }

        .info-block { margin-bottom: 12px; }
        .info-block:last-child { margin-bottom: 0; }

        .panel-title {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 3px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .panel-data { font-size: 1.1rem; font-weight: bold; }


        /* --- CONTENEDOR CENTRAL (Números y Texto) --- */
        /* Al usar flex-direction: column, texto y números nunca se pisan */
        #center-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 35px; /* Separación fija entre bolas y texto */
            z-index: 2;
        }

        #numbers-wrapper {
            position: relative;
            perspective: 1200px;
            width: 100%;
            display: none; 
        }

        #numbers-wrapper::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 5px;
            height: 5px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 80px 40px #fff, 0 0 150px 80px #00ffcc;
            animation: starExplosion 2.5s ease-out forwards;
            z-index: -1;
            opacity: 0;
        }

        #numbers-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            animation: containerFlyIn 2.5s cubic-bezier(0.1, 1, 0.2, 1) forwards;
        }

        .number-ball {
            background-color: rgba(0, 0, 0, 0.7); 
            color: #fff;
            width: 70px;
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%; 
            border: 2px solid rgba(255, 255, 255, 0.4);
            font-size: 1.8rem;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px); 
            opacity: 0; 
        }

        #info-text {
            color: rgba(255,255,255,0.7);
            font-size: 0.95rem;
            text-align: center;
            background: rgba(0,0,0,0.5);
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: fadeInText 4s ease-in forwards;
            opacity: 0;
            display: none; 
        }

        /* --- ANIMACIONES --- */
        @keyframes fadeInText { 80% { opacity: 0; } 100% { opacity: 1; } }
        @keyframes starExplosion {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            10% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            40% { transform: translate(-50%, -50%) scale(6); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(10); opacity: 0; }
        }
        @keyframes containerFlyIn {
            0% { transform: translateZ(-2000px) scale(0.1); }
            100% { transform: translateZ(0) scale(1); }
        }
        @keyframes ballMaterialize {
            0% { opacity: 0; transform: scale(0) rotate(720deg); box-shadow: 0 0 100px 50px rgba(0, 255, 204, 0.8); color: transparent; }
            30% { opacity: 1; color: #fff; box-shadow: 0 0 50px 20px rgba(0, 255, 204, 0.6); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); box-shadow: 0 0 15px rgba(255, 255, 255, 0.2); color: #fff; }
        }

        /* ========================================= */
        /* 📱 MODO MÓVIL (Responsividad)             */
        /* ========================================= */
        @media (max-width: 650px) {
            /* Transformar paneles laterales en barras horizontales apiladas */
            .info-panel {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 10px 15px;
                left: 10px !important;
                right: 10px !important;
                width: auto;
            }
            #top-left-panel { top: 10px; text-align: left; }
            #top-right-panel { top: 75px; text-align: left; }
            
            .info-block { margin-bottom: 0; text-align: left; }
            .info-block:last-child { text-align: right; }
            
            .panel-data { font-size: 0.95rem; }
            .panel-title { font-size: 0.65rem; }

            /* Bajar el contenido central para que no choque con los paneles */
            #center-content { top: 60%; gap: 25px; }

            /* Reducir tamaño de las bolas */
            .number-ball {
                width: 55px;
                height: 55px;
                font-size: 1.4rem;
            }
            #numbers-container { gap: 12px; }
            
            /* Ajustar texto inferior */
            #info-text { font-size: 0.8rem; padding: 8px 15px; }
        }
    </style>
</head>
<body>

    <!-- Fondo de estrellas -->
    <canvas id="space"></canvas>

    <!-- PANTALLA DE SEGURIDAD -->
    <div id="security-screen">
        <div class="security-box" id="security-box">
            <h2>¿Este es el planeta de los...?</h2>
            <input type="password" id="password-input" placeholder="..." autocomplete="off">
            <button onclick="checkPassword()">Acceder</button>
        </div>
    </div>

    <!-- Panel Izquierdo: Fecha y Reloj -->
    <div id="top-left-panel" class="info-panel">
        <div class="info-block">
            <div class="panel-title">Fecha Local</div>
            <div id="date-display" class="panel-data">Cargando...</div>
        </div>
        <div class="info-block">
            <div class="panel-title">Reloj Local</div>
            <div id="time-display" class="panel-data">--:--:--</div>
        </div>
    </div>

    <!-- Panel Derecho: Ubicación y Clima -->
    <div id="top-right-panel" class="info-panel">
        <div class="info-block">
            <div class="panel-title">Ubicación</div>
            <div id="location-display" class="panel-data">Buscando...</div>
        </div>
        <div class="info-block">
            <div class="panel-title">Clima Actual</div>
            <div id="weather-display" class="panel-data">-- °C</div>
        </div>
    </div>

    <!-- Contenedor unificado para que no se solapen elementos -->
    <div id="center-content">
        <!-- Jugada de la Bonoloto -->
        <div id="numbers-wrapper">
            <div id="numbers-container"></div>
        </div>
        <!-- Texto inferior -->
        <div id="info-text">Jugada probabilística para el sorteo del: <span id="next-draw-date"></span></div>
    </div>

    <script>
        // --- 0. SISTEMA DE SEGURIDAD ---
        function checkPassword() {
            const input = document.getElementById('password-input');
            const password = input.value.trim().toLowerCase();
            const securityBox = document.getElementById('security-box');
            const securityScreen = document.getElementById('security-screen');

            if (password === 'mimisos') {
                securityScreen.style.opacity = '0';
                setTimeout(() => {
                    securityScreen.style.display = 'none';
                    document.getElementById('numbers-wrapper').style.display = 'block';
                    document.getElementById('info-text').style.display = 'block';
                    generateDateBasedBonoloto();
                }, 500); 
            } else {
                securityBox.classList.add('error-shake');
                input.value = ''; 
                setTimeout(() => { securityBox.classList.remove('error-shake'); }, 400);
            }
        }

        document.getElementById('password-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') checkPassword();
        });

        // --- 1. RELOJ Y FECHA ---
        function updateClockAndDate() {
            const now = new Date();
            const dateOptions = { weekday: 'long', year: 'numeric', month: '2-digit', day: '2-digit' };
            const formattedDate = now.toLocaleDateString('es-ES', dateOptions);
            document.getElementById('date-display').innerText = formattedDate.charAt(0).toUpperCase() + formattedDate.slice(1);
            const timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit' };
            document.getElementById('time-display').innerText = now.toLocaleTimeString('es-ES', timeOptions);
        }
        setInterval(updateClockAndDate, 1000);
        updateClockAndDate();

        // --- 2. UBICACIÓN Y CLIMA POR IP ---
        async function fetchWeatherAndLocation() {
            try {
                const geoResponse = await fetch('https://get.geojs.io/v1/ip/geo.json');
                const geoData = await geoResponse.json();
                
                const city = geoData.city || "Ubicación detectada";
                const lat = geoData.latitude;
                const lon = geoData.longitude;
                
                document.getElementById('location-display').innerText = city;

                const weatherResponse = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
                const weatherData = await weatherResponse.json();
                const temp = weatherData.current_weather.temperature;
                
                document.getElementById('weather-display').innerText = `${temp} °C`;
            } catch (error) {
                document.getElementById('location-display').innerText = "Oculto";
                document.getElementById('weather-display').innerText = "-- °C";
            }
        }
        fetchWeatherAndLocation();

        // --- 3. LÓGICA DE BONOLOTO POR FECHA ---
        function seededRandom(seed) {
            let x = Math.sin(seed++) * 10000;
            return x - Math.floor(x);
        }

        function generateDateBasedBonoloto() {
            const today = new Date();
            const tomorrow = new Date(today);
            tomorrow.setDate(tomorrow.getDate() + 1);

            document.getElementById('next-draw-date').innerText = tomorrow.toLocaleDateString('es-ES');

            let seed = (tomorrow.getFullYear() * 10000) + ((tomorrow.getMonth() + 1) * 100) + tomorrow.getDate();

            const numerosCalientes = [33, 10, 34, 2, 22, 11, 23, 31, 3, 19];
            const numerosFrios = [43, 5, 8, 49, 13, 20, 27];
            
            let pool = [];
            for (let i = 1; i <= 49; i++) {
                if (numerosCalientes.includes(i)) pool.push(i, i, i, i); 
                else if (numerosFrios.includes(i)) pool.push(i); 
                else pool.push(i, i); 
            }

            let combinacion = new Set(); 
            while (combinacion.size < 6) {
                seed += 1; 
                let randomVal = seededRandom(seed);
                let indiceElegido = Math.floor(randomVal * pool.length);
                combinacion.add(pool[indiceElegido]);
            }

            let htmlContent = '';
            Array.from(combinacion).sort((a, b) => a - b).forEach((num, index) => {
                let delay = index * 0.3; 
                htmlContent += `<div class="number-ball" style="animation: ballMaterialize 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) ${delay}s forwards;">${num.toString().padStart(2, '0')}</div>`;
            });

            document.getElementById('numbers-container').innerHTML = htmlContent;
        }

        // --- 4. FONDO ESPACIAL ---
        const canvas = document.getElementById('space');
        const ctx = canvas.getContext('2d');
        let width, height;
        let stars = [];
        const numStars = 800;
        const speed = 8;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        class Star {
            constructor() { this.reset(); }
            reset() {
                this.x = (Math.random() - 0.5) * width * 2;
                this.y = (Math.random() - 0.5) * height * 2;
                this.z = Math.random() * width;
                this.pz = this.z;
            }
            update() {
                this.z -= speed;
                if (this.z <= 0) {
                    this.reset();
                    this.z = width;
                    this.pz = this.z;
                }
            }
            draw() {
                let sx = (this.x / this.z) * (width / 2) + width / 2;
                let sy = (this.y / this.z) * (height / 2) + height / 2;
                let px = (this.x / this.pz) * (width / 2) + width / 2;
                let py = (this.y / this.pz) * (height / 2) + height / 2;
                this.pz = this.z;
                
                let r = (1 - this.z / width) * 3;
                let alpha = 1 - (this.z / width);

                ctx.beginPath();
                ctx.moveTo(px, py);
                ctx.lineTo(sx, sy);
                ctx.lineWidth = Math.max(0, r);
                ctx.strokeStyle = `rgba(255, 255, 255, ${Math.max(0, alpha)})`;
                ctx.stroke();
            }
        }

        for (let i = 0; i < numStars; i++) stars.push(new Star());

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.fillRect(0, 0, width, height);
            stars.forEach(star => { star.update(); star.draw(); });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
