<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>We love you Glu Glu</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace; 
            color: rgba(255, 255, 255, 0.85);
        }
        
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* --- Paneles de información (Reloj, Fecha y Clima) --- */
        .info-panel {
            position: absolute;
            z-index: 3;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            backdrop-filter: blur(3px);
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }

        #top-left-panel { top: 20px; left: 20px; }
        #top-right-panel { top: 20px; right: 20px; text-align: right; }

        .panel-title {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .panel-data { font-size: 1.2rem; font-weight: bold; }

        #info-text {
            position: absolute;
            top: 65%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            color: rgba(255,255,255,0.6);
            font-size: 0.9rem;
            text-align: center;
            background: rgba(0,0,0,0.5);
            padding: 5px 15px;
            border-radius: 20px;
            /* El texto también aparece con un suave retraso */
            animation: fadeInText 4s ease-in forwards;
            opacity: 0;
        }

        @keyframes fadeInText {
            80% { opacity: 0; }
            100% { opacity: 1; }
        }

        /* --- CONTENEDORES DE LA ANIMACIÓN 3D --- */
        
        /* Envoltorio que le da la perspectiva 3D al vuelo */
        #numbers-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            perspective: 1200px; /* Profundidad 3D */
            width: 90%;
            max-width: 800px;
        }

        /* Efecto de destello de estrella (Supernova inicial) */
        #numbers-wrapper::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 5px;
            height: 5px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 80px 40px #fff, 0 0 150px 80px #00ffcc;
            animation: starExplosion 2.5s ease-out forwards;
            z-index: -1;
            opacity: 0;
        }

        /* El contenedor de las bolas se acerca hacia la cámara */
        #numbers-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            animation: containerFlyIn 2.5s cubic-bezier(0.1, 1, 0.2, 1) forwards;
        }

        /* Las bolas en sí */
        .number-ball {
            background-color: rgba(0, 0, 0, 0.7); 
            color: #fff;
            width: 70px;
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%; 
            border: 2px solid rgba(255, 255, 255, 0.4);
            font-size: 1.8rem;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px); 
            
            /* Ocultas al principio, la animación se inyecta por JS */
            opacity: 0; 
        }

        /* --- KEYFRAMES DE LAS ANIMACIONES --- */
        
        /* Explosión de luz central */
        @keyframes starExplosion {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            10% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            40% { transform: translate(-50%, -50%) scale(6); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(10); opacity: 0; }
        }

        /* El contenedor vuela desde el fondo (Z = -2000px) hasta el frente */
        @keyframes containerFlyIn {
            0% { transform: translateZ(-2000px) scale(0.1); }
            100% { transform: translateZ(0) scale(1); }
        }

        /* Cada bola se materializa girando y soltando energía */
        @keyframes ballMaterialize {
            0% {
                opacity: 0;
                transform: scale(0) rotate(720deg);
                box-shadow: 0 0 100px 50px rgba(0, 255, 204, 0.8);
                color: transparent;
            }
            30% {
                opacity: 1;
                color: #fff;
                box-shadow: 0 0 50px 20px rgba(0, 255, 204, 0.6);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
                box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
                color: #fff;
            }
        }
    </style>
</head>
<body>

    <!-- Fondo de estrellas -->
    <canvas id="space"></canvas>

    <!-- Panel Superior Izquierdo: Fecha y Reloj -->
    <div id="top-left-panel" class="info-panel">
        <div class="panel-title">Fecha Local</div>
        <div id="date-display" class="panel-data">Cargando...</div>
        <div style="margin-top: 10px;"></div>
        <div class="panel-title">Reloj Local</div>
        <div id="time-display" class="panel-data">--:--:--</div>
    </div>

    <!-- Panel Superior Derecho: Ubicación y Clima -->
    <div id="top-right-panel" class="info-panel">
        <div class="panel-title">Ubicación</div>
        <div id="location-display" class="panel-data">Buscando...</div>
        <div style="margin-top: 10px;"></div>
        <div class="panel-title">Clima Actual</div>
        <div id="weather-display" class="panel-data">-- °C</div>
    </div>

    <!-- Envoltorio y Jugada de la Bonoloto -->
    <div id="numbers-wrapper">
        <div id="numbers-container"></div>
    </div>
    
    <div id="info-text">Jugada probabilística calculada para el sorteo del: <span id="next-draw-date"></span></div>

    <script>
        // --- 1. RELOJ Y FECHA ---
        function updateClockAndDate() {
            const now = new Date();
            const dateOptions = { weekday: 'long', year: 'numeric', month: '2-digit', day: '2-digit' };
            const formattedDate = now.toLocaleDateString('es-ES', dateOptions);
            document.getElementById('date-display').innerText = formattedDate.charAt(0).toUpperCase() + formattedDate.slice(1);
            const timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit' };
            document.getElementById('time-display').innerText = now.toLocaleTimeString('es-ES', timeOptions);
        }
        setInterval(updateClockAndDate, 1000);
        updateClockAndDate();

        // --- 2. UBICACIÓN Y CLIMA ---
        async function fetchWeatherAndLocation(lat, lon) {
            try {
                const geoResponse = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
                const geoData = await geoResponse.json();
                const city = geoData.address.city || geoData.address.town || geoData.address.village || geoData.address.state || "Ubicación detectada";
                document.getElementById('location-display').innerText = city;

                const weatherResponse = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
                const weatherData = await weatherResponse.json();
                const temp = weatherData.current_weather.temperature;
                document.getElementById('weather-display').innerText = `${temp} °C`;
            } catch (error) {
                document.getElementById('location-display').innerText = "Datos no disponibles";
                document.getElementById('weather-display').innerText = "-- °C";
            }
        }

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => fetchWeatherAndLocation(position.coords.latitude, position.coords.longitude),
                (error) => {
                    document.getElementById('location-display').innerText = "Permiso denegado";
                    document.getElementById('weather-display').innerText = "Desconocido";
                }
            );
        }

        // --- 3. LÓGICA DE BONOLOTO POR FECHA CON ANIMACIÓN ---
        function seededRandom(seed) {
            let x = Math.sin(seed++) * 10000;
            return x - Math.floor(x);
        }

        function generateDateBasedBonoloto() {
            const today = new Date();
            const tomorrow = new Date(today);
            tomorrow.setDate(tomorrow.getDate() + 1);

            const tomorrowStr = tomorrow.toLocaleDateString('es-ES');
            document.getElementById('next-draw-date').innerText = tomorrowStr;

            let seed = (tomorrow.getFullYear() * 10000) + ((tomorrow.getMonth() + 1) * 100) + tomorrow.getDate();

            const numerosCalientes = [33, 10, 34, 2, 22, 11, 23, 31, 3, 19];
            const numerosFrios = [43, 5, 8, 49, 13, 20, 27];
            
            let pool = [];
            for (let i = 1; i <= 49; i++) {
                if (numerosCalientes.includes(i)) pool.push(i, i, i, i); 
                else if (numerosFrios.includes(i)) pool.push(i); 
                else pool.push(i, i); 
            }

            let combinacion = new Set(); 
            while (combinacion.size < 6) {
                seed += 1; 
                let randomVal = seededRandom(seed);
                let indiceElegido = Math.floor(randomVal * pool.length);
                combinacion.add(pool[indiceElegido]);
            }

            let combinacionOrdenada = Array.from(combinacion).sort((a, b) => a - b);

            let htmlContent = '';
            combinacionOrdenada.forEach((num, index) => {
                let numeroFormateado = num.toString().padStart(2, '0');
                // MAGIA AQUÍ: Calculamos un retraso para que salgan disparadas una por una
                let delay = index * 0.3; // 0s, 0.3s, 0.6s...
                // Se inyecta la animación 'ballMaterialize' con su retraso específico
                htmlContent += `<div class="number-ball" style="animation: ballMaterialize 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) ${delay}s forwards;">${numeroFormateado}</div>`;
            });

            document.getElementById('numbers-container').innerHTML = htmlContent;
        }

        generateDateBasedBonoloto();

        // --- 4. LÓGICA DEL FONDO ESPACIAL ---
        const canvas = document.getElementById('space');
        const ctx = canvas.getContext('2d');

        let width, height;
        let stars = [];
        
        const numStars = 800;
        const speed = 8;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        class Star {
            constructor() { this.reset(); }
            reset() {
                this.x = (Math.random() - 0.5) * width * 2;
                this.y = (Math.random() - 0.5) * height * 2;
                this.z = Math.random() * width;
                this.pz = this.z;
            }
            update() {
                this.z -= speed;
                if (this.z <= 0) {
                    this.reset();
                    this.z = width;
                    this.pz = this.z;
                }
            }
            draw() {
                let sx = (this.x / this.z) * (width / 2) + width / 2;
                let sy = (this.y / this.z) * (height / 2) + height / 2;
                let px = (this.x / this.pz) * (width / 2) + width / 2;
                let py = (this.y / this.pz) * (height / 2) + height / 2;
                this.pz = this.z;
                
                let r = (1 - this.z / width) * 3;
                let alpha = 1 - (this.z / width);

                ctx.beginPath();
                ctx.moveTo(px, py);
                ctx.lineTo(sx, sy);
                ctx.lineWidth = Math.max(0, r);
                ctx.strokeStyle = `rgba(255, 255, 255, ${Math.max(0, alpha)})`;
                ctx.stroke();
            }
        }

        for (let i = 0; i < numStars; i++) {
            stars.push(new Star());
        }

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.fillRect(0, 0, width, height);

            stars.forEach(star => {
                star.update();
                star.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
