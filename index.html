<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>we love you glu glu</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace; 
        }
        
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #numbers-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2; 
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            width: 90%;
            max-width: 800px;
        }

        .number-ball {
            background-color: rgba(0, 0, 0, 0.7); 
            color: #fff;
            width: 70px;
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%; 
            border: 2px solid rgba(255, 255, 255, 0.4);
            font-size: 1.8rem;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.9); 
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px); 
            transition: transform 0.3s;
        }

        .number-ball:hover {
            transform: scale(1.1);
            border-color: #00ffcc;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
        }

        /* Pequeño texto informativo */
        #info-text {
            position: absolute;
            top: 65%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            color: rgba(255,255,255,0.5);
            font-size: 0.9rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <canvas id="space"></canvas>

    <div id="numbers-container"></div>
    <div id="info-text">Generado usando pesos de frecuencia histórica de la Bonoloto</div>

    <script>
        // --- 1. LÓGICA DE PROBABILIDAD PONDERADA ---
        function generateWeightedBonoloto() {
            const container = document.getElementById('numbers-container');
            
            // Datos históricos aproximados de la Bonoloto
            const numerosCalientes = [33, 10, 34, 2, 22, 11, 23, 31, 3, 19];
            const numerosFrios = [43, 5, 8, 49, 13, 20, 27];
            
            // Creamos una "urna" donde meteremos los números
            let pool = [];

            // Llenamos la urna ajustando la probabilidad (cantidad de tickets)
            for (let i = 1; i <= 49; i++) {
                if (numerosCalientes.includes(i)) {
                    // Los calientes meten 4 tickets en la urna
                    pool.push(i, i, i, i); 
                } else if (numerosFrios.includes(i)) {
                    // Los fríos solo meten 1 ticket en la urna
                    pool.push(i);
                } else {
                    // Los neutros meten 2 tickets en la urna
                    pool.push(i, i);
                }
            }

            let combinacion = new Set(); 

            // Sacamos 6 bolas de la urna ponderada
            while (combinacion.size < 6) {
                // Elegimos un índice al azar de nuestra urna
                let indiceAleatorio = Math.floor(Math.random() * pool.length);
                let numeroElegido = pool[indiceAleatorio];
                
                combinacion.add(numeroElegido);
            }

            // Convertimos y ordenamos de menor a mayor
            let combinacionOrdenada = Array.from(combinacion).sort((a, b) => a - b);

            let htmlContent = '';
            combinacionOrdenada.forEach(num => {
                let numeroFormateado = num.toString().padStart(2, '0');
                htmlContent += `<div class="number-ball">${numeroFormateado}</div>`;
            });

            container.innerHTML = htmlContent;
        }

        generateWeightedBonoloto();

        // --- 2. LÓGICA DEL FONDO ESPACIAL ---
        const canvas = document.getElementById('space');
        const ctx = canvas.getContext('2d');

        let width, height;
        let stars = [];
        
        const numStars = 800;
        const speed = 8;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        class Star {
            constructor() { this.reset(); }
            reset() {
                this.x = (Math.random() - 0.5) * width * 2;
                this.y = (Math.random() - 0.5) * height * 2;
                this.z = Math.random() * width;
                this.pz = this.z;
            }
            update() {
                this.z -= speed;
                if (this.z <= 0) {
                    this.reset();
                    this.z = width;
                    this.pz = this.z;
                }
            }
            draw() {
                let sx = (this.x / this.z) * (width / 2) + width / 2;
                let sy = (this.y / this.z) * (height / 2) + height / 2;
                let px = (this.x / this.pz) * (width / 2) + width / 2;
                let py = (this.y / this.pz) * (height / 2) + height / 2;
                this.pz = this.z;
                
                let r = (1 - this.z / width) * 3;
                let alpha = 1 - (this.z / width);

                ctx.beginPath();
                ctx.moveTo(px, py);
                ctx.lineTo(sx, sy);
                ctx.lineWidth = Math.max(0, r);
                ctx.strokeStyle = `rgba(255, 255, 255, ${Math.max(0, alpha)})`;
                ctx.stroke();
            }
        }

        for (let i = 0; i < numStars; i++) {
            stars.push(new Star());
        }

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.fillRect(0, 0, width, height);

            stars.forEach(star => {
                star.update();
                star.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
